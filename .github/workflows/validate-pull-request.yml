name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify release identity
        run: npm run verify:release

      - name: Verify scale guard
        run: npm run check:scale

      - name: Maintenance Worker TypeScript check
        run: npm run worker:typecheck

      - name: Maintenance Worker tests
        run: npm run worker:test

      - name: Package complete source tree
        shell: bash
        run: git archive --format=zip --output=olhos-do-campus-1.0.1.zip HEAD

      - name: Upload 1.0.1 source package
        uses: actions/upload-artifact@v4
        with:
          name: olhos-do-campus-1.0.1-source
          path: olhos-do-campus-1.0.1.zip
          if-no-files-found: error
          retention-days: 30
