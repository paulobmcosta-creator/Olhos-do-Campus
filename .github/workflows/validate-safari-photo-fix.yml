name: Validate Safari photo fix

on:
  push:
    branches:
      - main
    paths:
      - src/utils/image.ts
      - tests/imageClient.test.ts
      - docs/PROCESSAMENTO_DE_IMAGENS.md
      - .github/workflows/validate-safari-photo-fix.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Safari photo fix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build Cloudflare Pages frontend
        run: npm run build:pages
