name: Deploy Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_PAGES_PROJECT: olhos-do-campus
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_FIREBASE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      VITE_USE_FIREBASE_EMULATORS: "false"
      VITE_APP_CHECK_ENABLED: "true"
      VITE_APP_CHECK_DEBUG: "false"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_ACCOUNT_ID
            VITE_API_BASE_URL
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_RECAPTCHA_ENTERPRISE_SITE_KEY
          )

          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Actions variable $name is not configured."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          if [[ "$VITE_API_BASE_URL" != https://* ]]; then
            echo "::error::VITE_API_BASE_URL must be an HTTPS origin."
            exit 1
          fi

          if [[ "$VITE_USE_FIREBASE_EMULATORS" != "false" || "$VITE_APP_CHECK_ENABLED" != "true" || "$VITE_APP_CHECK_DEBUG" != "false" ]]; then
            echo "::error::Production App Check policy is invalid."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build Cloudflare Pages frontend
        run: npm run build:pages

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/client/index.html

          if ! grep -R -F -q -- "$VITE_API_BASE_URL" dist/client/assets; then
            echo "::error::VITE_API_BASE_URL was not embedded in the production bundle."
            exit 1
          fi

          if ! grep -R -F -q -- "$VITE_FIREBASE_APP_ID" dist/client/assets; then
            echo "::error::VITE_FIREBASE_APP_ID was not embedded in the production bundle."
            exit 1
          fi

          if ! grep -R -F -q -- "$VITE_FIREBASE_RECAPTCHA_ENTERPRISE_SITE_KEY" dist/client/assets; then
            echo "::error::The reCAPTCHA Enterprise site key was not embedded in the production bundle."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

          npx wrangler pages deploy dist/client \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false
